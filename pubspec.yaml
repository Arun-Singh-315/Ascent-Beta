name: ascent
description: "Ascent - Job Prep Companion App. Your personal job-search operating system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Database ────────────────────────────────────────────────────────────────
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.0

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^18.0.1

  # ── Charts ──────────────────────────────────────────────────────────────────
  fl_chart: ^1.2.0

  # ── Notifications ───────────────────────────────────────────────────────────
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # ── File Handling ───────────────────────────────────────────────────────────
  file_picker: ^12.3.0
  path_provider: ^2.1.4
  open_filex: ^4.7.0
  share_plus: ^13.3.0
  flutter_pdfview: ^1.4.5

  # ── Fonts ───────────────────────────────────────────────────────────────────
  google_fonts: ^8.2.1

  # ── Animations ──────────────────────────────────────────────────────────────
  shimmer: ^4.0.0
  flutter_confetti: ^0.9.2
  motor: ^1.1.0
  heroine: ^0.7.2

  # ── Utilities ───────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.20.1
  package_info_plus: ^10.2.1

  cupertino_icons: ^1.0.8
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ─────────────────────────────────────────────────────────
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#080C14"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

